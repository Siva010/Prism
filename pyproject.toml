[project]
name = "prism"
version = "0.1.0"
description = "Claude-native LLM gateway with layered caching, two-axis adaptive routing, and continuous evaluation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "anthropic>=0.40",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "structlog>=24.4",
    "orjson>=3.10",
    "numpy>=2.1",
]

[project.optional-dependencies]
# The local embedding model. Kept out of the base install because torch is
# large and a gateway with the semantic cache disabled never loads it.
embeddings = [
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
